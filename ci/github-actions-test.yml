name: Plugin compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DroppedNeedle/DroppedNeedle
          ref: 1cf117b4e0f3899d1daa786d316fd9ee8bcea1ab
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r upstream/backend/requirements-dev.txt
      - run: python -m pytest -q
        env:
          DROPPEDNEEDLE_SOURCE: ${{ github.workspace }}/upstream
      - run: python -m ruff check plugin.py tests
      - run: python -m ruff format --check plugin.py tests
